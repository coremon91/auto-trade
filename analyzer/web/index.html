<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코인 스캐너</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #646b78; --line: #e3e6eb;
  --accent: #2f6fde; --accent-ink: #ffffff; --up: #138a4c; --down: #cc3a32; --warn: #b26a00;
  --chip: #eef1f6; --hover: #f2f5fa; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a20; --ink: #e8eaee; --muted: #9aa2b1; --line: #2a2f38;
    --accent: #5b8ff0; --accent-ink: #0b0d10; --up: #35c27a; --down: #f0675e; --warn: #e0a33a;
    --chip: #222731; --hover: #1d2129; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a20; --ink: #e8eaee; --muted: #9aa2b1; --line: #2a2f38;
  --accent: #5b8ff0; --accent-ink: #0b0d10; --up: #35c27a; --down: #f0675e; --warn: #e0a33a;
  --chip: #222731; --hover: #1d2129; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0 12px 0 0; }
.muted { color: var(--muted); }
select, input, button { font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .55; cursor: default; }
main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 16px; }
.controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; align-items: end; }
.controls label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.controls label.check { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); white-space: nowrap; min-height: 33px; }
.controls label.check input[type=checkbox] { width: auto; margin: 0; }
.controls input, .controls select { width: 100%; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
pre.log { background: var(--chip); border-radius: 6px; padding: 10px; font-size: 12px; max-height: 220px; overflow: auto;
  white-space: pre-wrap; margin: 10px 0 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 9px 14px;
  color: var(--muted); white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tbody tr:hover { background: var(--hover); }
tr.click { cursor: pointer; }
.up { color: var(--up); } .down { color: var(--down); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; }
.chip.go { background: color-mix(in srgb, var(--up) 18%, transparent); color: var(--up); }
.chip.bad { background: color-mix(in srgb, var(--down) 18%, transparent); color: var(--down); }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-left: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card img { width: 100%; display: block; cursor: zoom-in; background: #fff; }
.card .meta { padding: 10px 12px; font-size: 13px; }
.card .meta h3 { margin: 0 0 4px; font-size: 15px; }
.kv { display: grid; grid-template-columns: auto auto; gap: 2px 10px; font-size: 12px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
h2 { font-size: 15px; margin: 0 0 10px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
#modal img { max-width: 100%; max-height: 100%; border-radius: 6px; background: #fff; }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
text.ax { font-size: 11px; fill: var(--muted); }
.tabs .dot { width: 7px; height: 7px; margin-right: 5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--panel); color: var(--muted); padding: 6px 12px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.mgrid { display: grid; gap: 4px; }
.mrow { display: grid; grid-template-columns: minmax(150px, 230px) 1fr; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.hb { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 8px; font-size: 12px; }
.hl { color: var(--muted); }
.hv { text-align: right; font-variant-numeric: tabular-nums; }
.axis { display: grid; grid-template-columns: 1fr 1fr; height: 12px; }
.axis .neg { display: flex; justify-content: flex-end; border-right: 1px solid var(--muted); }
.axis i { display: block; height: 100%; border-radius: 2px; }
.sig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.sig-col .sig-h { margin-bottom: 6px; font-size: 13px; }
.sig-col .chip { margin: 0 4px 4px 0; }
@media (max-width: 640px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>코인 스캐너</h1>
  <label class="muted">실행 기록 <select id="runSel"></select></label>
  <span id="runInfo" class="muted"></span>
  <span style="flex:1"></span>
  <button id="themeBtn" title="테마 전환">라이트/다크</button>
</header>
<main>
  <section class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">스캔 실행 <span class="muted" style="font-weight:400;font-size:12px">6가지 방식을 한 번에 돌리고 신호를 기록합니다</span></h2>
      <span id="jobState" class="chip">대기</span>
    </div>
    <div class="controls">
      <label>데이터<select id="p_source"><option value="api">바이낸스 API (실시간)</option><option value="archive">공개 아카이브 (1~2일 지연)</option></select></label>
      <label>상승 상위 종목 수<input id="p_top" type="number" value="5" min="1" max="30"></label>
      <label>후보 표시 수<input id="p_pick" type="number" value="20" min="5" max="100"></label>
      <label>launch 탐색(h)<input id="p_lookback" type="number" value="72" min="24" max="400"></label>
      <label>횡보 구간(h)<input id="p_range_hours" type="number" value="24" min="6" max="168"></label>
      <label>최근 거래량 구간(h)<input id="p_recent" type="number" value="4" min="1" max="24"></label>
      <label>거래량 배수<input id="p_vol_mult" type="number" value="2" step="0.1" min="1"></label>
      <label class="check"><input id="p_library" type="checkbox" checked> 누적 패턴 전체와 비교</label>
      <label class="check"><input id="autoRun" type="checkbox"> 자동 반복
        <select id="autoMin" style="width:auto"><option>15</option><option selected>30</option><option>60</option></select>분</label>
      <button id="runBtn" class="primary">스캔 실행</button>
    </div>
    <pre id="log" class="log" hidden></pre>
  </section>

  <div class="tabs" id="tabs">
    <button data-t="compare" class="on">6가지 비교</button>
    <button data-t="M1"><span class="dot" style="background:#2f6fde"></span>M1 급등 차트 유사</button>
    <button data-t="M2"><span class="dot" style="background:#0f9d8a"></span>M2 횡보+거래량</button>
    <button data-t="M3"><span class="dot" style="background:#c27c0e"></span>M3 이평선</button>
    <button data-t="M4"><span class="dot" style="background:#9b5de5"></span>M4 RSI</button>
    <button data-t="M5"><span class="dot" style="background:#d1495b"></span>M5 펀딩+OI</button>
    <button data-t="M6"><span class="dot" style="background:#3a86ff"></span>M6 상대강도</button>
    <button data-t="paper">가상 매매</button>
    <button data-t="library">패턴 기록</button>
    <button data-t="bt">백테스트</button>
  </div>
  <div id="view"></div>
</main>
<div id="modal"><img alt=""></div>

<script>
const $ = s => document.querySelector(s);
const pct = (v, d = 1) => v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const cls = v => v == null ? "" : v > 0 ? "up" : v < 0 ? "down" : "";
const num = (v, d = 2) => v == null ? "–" : Number(v).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const img = p => { if (!p) return null; const s = p.replace(/\\/g, "/").split("/"); return "/img/" + s[s.length - 2] + "/" + encodeURIComponent(s[s.length - 1]); };
const money = v => v == null ? "–" : "$" + (v / 1e6).toFixed(1) + "M";
let EXITS = null;
let RUN = null, TAB = "compare", LIB = null, BT = null, CMP = null, SIGS = null, MSIG = {}, PAPER = null;
let PAMT = 100, PDAYS = "0", PB = "1";
try { PAMT = +(localStorage.getItem("pamt") || 100); PDAYS = localStorage.getItem("pdays") || "0"; PB = localStorage.getItem("pb") || "1"; } catch (e) {}
let CG = "backfill", CB = "1";   // 기본: BTC 20일선 위일 때만
try { CG = localStorage.getItem("cg") || CG; CB = localStorage.getItem("cb2") || CB; } catch (e) {}

// theme
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nx;
  try { localStorage.setItem("theme", nx); } catch (e) {}
};

// modal
$("#modal").onclick = () => $("#modal").style.display = "none";
function zoom(src) { $("#modal img").src = src; $("#modal").style.display = "flex"; }

// sortable tables
function table(cols, rows, opts = {}) {
  const id = "t" + Math.random().toString(36).slice(2);
  const html = `<div class="tw"><table id="${id}"><thead><tr>${cols.map((c, i) =>
    `<th data-i="${i}" class="${c.l ? "l" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
  setTimeout(() => {
    const t = document.getElementById(id); if (!t) return;
    let key = opts.sort ?? null, dir = -1;
    const draw = () => {
      let r = rows.slice();
      if (key != null) r.sort((a, b) => {
        const x = cols[key].v(a), y = cols[key].v(b);
        if (x == null) return 1; if (y == null) return -1;
        return (x > y ? 1 : x < y ? -1 : 0) * dir;
      });
      t.tBodies[0].innerHTML = r.map(x => `<tr class="${opts.click ? "click" : ""}" data-s="${esc(x.symbol)}">${cols.map(c =>
        `<td class="${c.l ? "l" : ""} ${c.c ? c.c(x) : ""}">${c.f(x)}</td>`).join("")}</tr>`).join("") ||
        `<tr><td colspan="${cols.length}" class="empty">없음</td></tr>`;
      if (opts.click) t.tBodies[0].querySelectorAll("tr.click").forEach(tr => tr.onclick = () => opts.click(tr.dataset.s));
    };
    t.tHead.querySelectorAll("th").forEach(th => th.onclick = () => {
      const i = +th.dataset.i; dir = key === i ? -dir : -1; key = i; draw();
    });
    draw();
  });
  return html;
}

function stats(items) {
  return `<div class="stats">${items.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;
}

function featKV(f) {
  const L = [["7일", pct(f.ret_7d)], ["24h", pct(f.ret_24h)], ["30일 고점 대비", pct(f.off_high_30d)],
    ["RSI(1h)", num(f.rsi_1h, 0)], ["ATR%(1h)", pct(f.atr_pct_1h, 2)], ["BB폭 순위(4h)", num(f.bbw_rank_4h)],
    ["거래량 배수(8h)", num(f.vol_ratio_8h)], ["펀딩", f.funding == null ? "–" : (f.funding * 100).toFixed(3) + "%"],
    ["OI 24h", pct(f.oi_chg_24h)]];
  return `<div class="kv">${L.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("")}</div>`;
}

function viewPattern() {
  if (!RUN) return `<div class="panel empty">실행 기록이 없습니다. 위에서 스캔을 실행하세요.</div>`;
  if (!RUN.patterns?.length && !RUN.candidates?.length)
    return `<div class="panel empty">이 실행은 '횡보 + 거래량' 방식만 돌렸습니다.</div>`;
  const pats = RUN.patterns.map(p => `<div class="card">
      ${p.png ? `<img src="${img(p.png)}" loading="lazy" onclick="zoom(this.src)">` : ""}
      <div class="meta"><h3>${esc(p.symbol)} <span class="up">+${(p.gain * 100).toFixed(0)}%</span></h3>
      <div class="muted" style="margin-bottom:6px">launch ${p.launch.slice(5, 16)} → peak ${p.peak.slice(5, 16)} · 24h ${pct(p.chg24)}</div>
      <div class="muted" style="font-size:12px;margin-bottom:4px">상승 직전 상태</div>${featKV(p.feat)}</div></div>`).join("");
  const cols = [
    {h: "#", v: x => x._i, f: x => x._i},
    {h: "종목", l: 1, v: x => x.symbol, f: x => `<b>${esc(x.symbol)}</b>`},
    {h: "점수", v: x => x.score, f: x => `${num(x.score)}<span class="bar" style="width:${Math.round(x.score * 60)}px"></span>`},
    {h: "모양", v: x => x.shape, f: x => num(x.shape)},
    {h: "특징", v: x => x.feat, f: x => num(x.feat)},
    {h: "닮은 패턴", l: 1, v: x => x.like, f: x => `${esc(x.like)} <span class="muted">${(x.like_launch || "").slice(5, 10)}</span>`},
    {h: "상관 4h", v: x => x.corr_4h, f: x => num(x.corr_4h), c: x => cls(x.corr_4h)},
    {h: "1h", v: x => x.corr_1h, f: x => num(x.corr_1h), c: x => cls(x.corr_1h)},
    {h: "15m", v: x => x.corr_15m, f: x => num(x.corr_15m), c: x => cls(x.corr_15m)},
    {h: "7일", v: x => x.ret_7d, f: x => pct(x.ret_7d), c: x => cls(x.ret_7d)},
    {h: "24h", v: x => x.ret_24h, f: x => pct(x.ret_24h), c: x => cls(x.ret_24h)},
    {h: "30일 고점 대비", v: x => x.off_high_30d, f: x => pct(x.off_high_30d)},
    {h: "RSI", v: x => x.rsi_1h, f: x => num(x.rsi_1h, 0)},
    {h: "거래량 배수", v: x => x.vol_ratio_8h, f: x => num(x.vol_ratio_8h)},
    {h: "OI 24h", v: x => x.oi_chg_24h, f: x => pct(x.oi_chg_24h), c: x => cls(x.oi_chg_24h)},
    {h: "차트", v: x => x.png ? 1 : 0, f: x => x.png ? "보기" : ""},
  ];
  const rows = RUN.candidates.map((x, i) => ({...x, _i: i + 1}));
  return stats([[RUN.patterns.length, "기록한 급등 패턴"], [RUN.n_candidates_scanned ?? "–", "비교한 후보 종목"],
                [RUN.library_size ?? "–", "누적 패턴 수"], [RUN.top.map(t => t.symbol.replace("USDT", "")).join(" · "), "24h 상승 상위"]]) +
    `<section class="panel"><h2>급등 종목 — 상승 직전 차트 (점선 = launch)</h2><div class="cards">${pats}</div></section>
     <section class="panel"><h2>지금 비슷한 차트</h2>
     ${table(cols, rows, {click: s => { const r = rows.find(x => x.symbol === s); if (r?.png) zoom(img(r.png)); }})}
     <p class="note">점수 = 0.5×모양(4h 42봉 · 1h 48봉 · 15m 48봉 가격/거래량 경로 상관) + 0.5×특징값 근접도. 차트가 있는 행을 누르면 확대.
     유사도는 급등 직전과 모양이 닮았다는 뜻일 뿐 급등 확률이 아닙니다.</p></section>`;
}

function viewRange() {
  const R = RUN?.range;
  if (!R) return `<div class="panel empty">이 실행에는 '횡보 + 거래량' 결과가 없습니다.</div>`;
  const sel = R.rows.filter(r => r.selected);
  const st = r => r.breakout ? `<span class="chip go">상단 돌파</span>` : r.below ? `<span class="chip bad">하단 이탈</span>` : `<span class="chip">박스 안</span>`;
  const cols = [
    {h: "종목", l: 1, v: x => x.symbol, f: x => `<b>${esc(x.symbol)}</b>`},
    {h: "박스", v: x => x.box, f: x => `<span class="chip">${x.box}</span>`},
    {h: "박스폭", v: x => x.range_pct, f: x => pct(x.range_pct, 2)},
    {h: "거래량 배수(박스 대비)", v: x => x.vol_ratio, f: x => num(x.vol_ratio) + "x", c: x => x.vol_ratio >= R.vol_mult ? "up" : ""},
    {h: "7일 평균 대비", v: x => x.vol_vs_7d, f: x => x.vol_vs_7d == null ? "–" : num(x.vol_vs_7d) + "x"},
    {h: `최근 ${R.recent}h 가격`, v: x => x.move_recent, f: x => pct(x.move_recent), c: x => cls(x.move_recent)},
    {h: "상태", v: x => x.breakout ? 2 : x.below ? 0 : 1, f: st},
    {h: "24h 거래대금", v: x => x.qv24, f: x => money(x.qv24)},
  ];
  const s3 = sel.filter(r => r.box === "3%"), s5 = sel.filter(r => r.box === "5%");
  return stats([[R.n3, `${R.hours}h 횡보 3% 이내`], [R.n5, `${R.hours}h 횡보 5% 이내 (3% 포함)`],
                [s3.length, `3% 박스 + 거래량 ${R.vol_mult}배↑`], [s5.length, `5% 박스 + 거래량 ${R.vol_mult}배↑`]]) +
    `<section class="panel"><h2>횡보 3% 이내 + 거래량 증가</h2>${table(cols, s3, {sort: 3})}</section>
     <section class="panel"><h2>횡보 5% 이내 + 거래량 증가</h2>${table(cols, s5, {sort: 3})}</section>

function btLegend() {
  return `<section class="panel"><h2>변형 이름 읽는 법 <span class="muted" style="font-weight:400">예: 4h|X2|A|BTC>SMA20</span></h2>

     <b>mtf</b> = 셋업 → 1h 종가 > EMA20 확인 → 15m 거래량 3배 돌파 → 다음 15m 시가 진입</span>
   <span>청산</span><span><b>X1</b> = 손절(직전 저점, 3~8%) / 3R 익절 / 72h ·
     <b>X2</b> = +1R 에서 손절을 본전으로, +15% 에서 절반 익절 후 나머지는 고점 대비 -12% 트레일링 / 72h</span>
   <span>셋업</span><span><b>A</b> = 7일 -15% 이하 + 14일 저점 근처 + 선행신호(펀딩 ≤ -0.03% / 조용한 거래량 3배 / BB폭 하위 10%) ·
     <b>B</b> = A 에서 선행신호 뺀 것 · <b>C</b> = MANTRA형(7일 -15%↓, 24h -12%~+3%, OI 24h +10%↑)</span>
   <span>필터</span><span><b>BTC>SMA20</b> = BTC 일봉 종가가 20일 이동평균 위일 때만 진입 (없으면 필터 없음)</span>
  </div>
  <p class="note">24개 변형 중 가장 좋은 것을 고르면 우연히 좋았던 것을 고를 위험(과최적화)이 있습니다. 거래 수가 적은 변형은 특히 주의.</p></section>`;
}

let LASTERR = null;

    아래 성과는 'BTC 20일선 위일 때만' 을 켜면 필터를 통과한 신호만 계산합니다.</span></div>` : "";

function seg(name, val, opts, cb) {

function viewCompare() {
  if (!CMP) { fetch(`/api/compare?group=${CG}&btc=${CB}`).then(r => r.json()).then(d => { CMP = d; render(); }).catch(e => { CMP = errObj(e); render(); }); return `<div class="panel empty">불러오는 중…</div>`; }
  if (!SIGS) { fetch(`/api/signals?group=${CG}&limit=100`).then(r => r.json()).then(d => { SIGS = d; render(); }).catch(e => { SIGS = errObj(e); render(); }); }
  const head = `<div class="row" style="margin-bottom:12px">
      ${seg("g", CG, [["backfill", "과거 채움 (아카이브)"], ["api", "실시간 기록 (API)"]], "setCG")}
      ${seg("b", CB, [["1", "BTC 20일선 위일 때만 (기본)"], ["0", "모든 신호"]], "setCB")}</div>`;
  if (!CMP.info) return head + `<div class="panel empty">${CG === "api" ? "아직 실시간 기록이 없습니다. 스캔을 실행하면 신호가 쌓이고, 4h·24h·72h 뒤 성과가 자동 계산됩니다."
      : "과거 채움 데이터가 없습니다. 명령 프롬프트에서 <code>python analyzer\\tracker.py backfill --days 60</code> 실행."}</div>`;
  const I = CMP.info, R = CMP.rows, main = R.filter(r => !r.sub);

  const best = main.filter(r => r.method !== "M0" && r.trade != null && r.n72 >= 10).sort((a, b) => b.trade - a.trade)[0];
  const maxAbs = Math.max(0.01, ...main.map(r => Math.abs(r.r72 ?? 0)), ...main.map(r => Math.abs(r.trade ?? 0)));

    return `<div class="mrow"><div class="mname"><span class="dot" style="background:${MCOLOR[r.method]}"></span><b>${r.method}</b> ${esc(r.name)}<div class="muted" style="font-size:12px">신호 ${r.n} · 72h 완료 ${r.n72}</div></div>

  }).join("");
  const cols = [

    {h: "4h", v: x => x.r4, f: x => pct(x.r4, 2), c: x => cls(x.r4)},
    {h: "24h", v: x => x.r24, f: x => pct(x.r24, 2), c: x => cls(x.r24)},
    {h: "72h 평균", v: x => x.r72, f: x => pct(x.r72, 2), c: x => cls(x.r72)},
    {h: "72h 중앙", v: x => x.r72_med, f: x => pct(x.r72_med, 2), c: x => cls(x.r72_med)},
    {h: "72h 승률", v: x => x.win72, f: x => x.win72 == null ? "–" : (x.win72 * 100).toFixed(0) + "%"},
    {h: "기준선 대비", v: x => x.excess72, f: x => pct(x.excess72, 2), c: x => cls(x.excess72)},
    {h: "거래 평균", v: x => x.trade, f: x => pct(x.trade, 2), c: x => cls(x.trade)},
    {h: "거래 승률", v: x => x.trade_win, f: x => x.trade_win == null ? "–" : (x.trade_win * 100).toFixed(0) + "%"},
    {h: "+30% 도달", v: x => x.hit30, f: x => x.hit30 == null ? "–" : (x.hit30 * 100).toFixed(1) + "%"},
    {h: "MFE 중앙", v: x => x.mfe_med, f: x => pct(x.mfe_med), c: () => "up"},
    {h: "MAE 중앙", v: x => x.mae_med, f: x => pct(x.mae_med), c: () => "down"},
  ];
  const ru = CMP.rules;
  if (!EXITS) fetch(`/api/exits?group=${CG}`).then(r => r.json()).then(d => { EXITS = d; render(); }).catch(() => { EXITS = {}; render(); });
  let exitHtml = "";
  if (EXITS && EXITS.summary) {

    const cell = (m, nm) => { const r = S[m][nm], best = Object.values(S[m]).reduce((a, b) => b.avg > a.avg ? b : a);
      const tip = `승률 ${(r.win * 100).toFixed(0)}% · PF ${r.pf == null ? "–" : r.pf.toFixed(2)} · 평균 ${r.hold.toFixed(0)}h 보유 · 앞 ${pct(r.first, 2)} / 뒤 ${pct(r.second, 2)} · n=${r.n}`;
      return `<td class="${cls(r.avg)}" title="${tip}" style="${r === best ? "font-weight:700;outline:2px solid var(--accent);outline-offset:-2px" : ""}">${pct(r.avg, 2)}</td>`; };
    exitHtml = `<section class="panel"><h2>청산 규칙 비교 <span class="muted" style="font-weight:400">같은 신호에 청산만 바꿈 · ${EXITS.n}건 · ${EXITS.start.slice(5, 10)}~${EXITS.end.slice(5, 10)}</span></h2>
      <div class="tw"><table><thead><tr><th>규칙</th>${ms.map(m => `<th><span class="dot" style="background:${MCOLOR[m]}"></span>${m}</th>`).join("")}</tr></thead>
      <tbody>${names.map(nm => `<tr><td class="l">${esc(nm)}</td>${ms.map(m => cell(m, nm)).join("")}</tr>`).join("")}</tbody></table></div>
      <p class="note">값 = 거래당 평균 수익률(수수료 포함). 굵은 테두리 = 그 방식에서 가장 좋은 규칙. 칸에 마우스를 올리면 승률·PF·보유시간·앞/뒤 구간 성과.

    ];

        return `<div class="sig-col"><div class="sig-h"><span class="dot" style="background:${MCOLOR[m]}"></span><b>${m}</b> ${esc(CMP.methods?.[m] || "")}</div>${l.length ? l.map(s => `<span class="chip">${esc(s.symbol.replace("USDT", ""))}${s.sub ? " · " + esc(s.sub) : ""}</span>`).join(" ") : `<span class="muted">없음</span>`}</div>`; }).join("")}</div></section>` : "";

                [best ? `${best.method} ${pct(best.trade, 2)}` : "–", "거래 평균 1위 (72h 10건 이상)"], [base ? pct(base.r72, 2) : "–", "무작위 기준선 72h 평균"]]) +

const RULES = {
  M1: ["급등 차트 유사", "24h 상승 상위 5개 종목의 '상승 직전' 차트(4h 42봉 · 1h 48봉 · 15m 48봉)와 특징값을 기록하고, 나머지 코인의 지금 차트와 비교해 가장 닮은 6종목."],
  M2: ["횡보 + 거래량 증가", "최근 4h 를 뺀 직전 24h 가 박스폭 3% 또는 5% 이내로 횡보했고, 최근 4h 평균 거래량이 박스 구간의 2배 이상인 종목 중 거래량 배수 상위 6개 (박스 하단 이탈 제외)."],
  M3: ["이평선 골든크로스", "1h EMA20 이 EMA50 을 최근 4시간 안에 위로 돌파했고, 종가가 1h EMA200 위인 종목. EMA200 대비 위에 있는 순으로 6개."],
  M4: ["RSI 과매도 반등", "1h RSI(14) 가 최근 3봉 안에 30 아래에 있다가 30 위로 회복한 종목. 강세 다이버전스(가격 저점↓, RSI 저점↑) 동반(div)을 우선, 그다음 RSI 가 더 낮았던 순으로 6개."],
  M5: ["펀딩+OI 숏스퀴즈", "7일 수익률 -15% 이하, 24h -12%~+3%, 펀딩 ≤ 0, 미결제약정(OI) 24h +10% 이상 — 숏이 몰린 하락 코인. OI 증가율 순으로 6개."],
  M6: ["BTC 대비 상대강도", "BTC 가 7일 고점 대비 -3% 이상 눌렸다가 1h EMA20 위로 회복 중일 때만. 코인/BTC 비율이 7일 고점의 97% 이상이고 7일 수익률이 BTC 보다 10%p 이상 높은 종목, 상대강도 순으로 6개."],
};
function detailKV(m, d) {
  const L = {
    M1: [["유사도", num(d.sim ?? d.score)], ["패턴 내 순위점수(z)", d.sim == null ? "–" : num(d.score)], ["닮은 패턴", esc(d.like || "")], ["모양", num(d.shape)], ["특징", num(d.feat)], ["상관 4h/1h/15m", `${num(d.corr_4h)}/${num(d.corr_1h)}/${num(d.corr_15m)}`]],
    M2: [["박스폭", pct(d.range_pct, 2)], ["거래량 배수", num(d.vol_ratio) + "x"], ["최근 가격", pct(d.move_recent)], ["상태", d.breakout ? "상단 돌파" : "박스 안"]],
    M3: [["EMA200 대비", pct(d.above_ema200)]],
    M4: [["직전 RSI 최저", num(d.rsi_min, 1)], ["다이버전스", d.div ? "있음" : "없음"]],
    M5: [["OI 24h", pct(d.oi_chg_24h)], ["펀딩", d.funding == null ? "–" : (d.funding * 100).toFixed(3) + "%"], ["7일", pct(d.ret_7d)]],
    M6: [["BTC 대비 7일", pct(d.rs7)], ["비율/7일 고점", num(d.ratio_vs_7d_high, 3)]],
  }[m] || [];
  return `<div class="kv">${L.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("")}</div>`;
}

function viewMethod(m) {
  if (!CMP) fetch(`/api/compare?group=${CG}&btc=${CB}`).then(r => r.json()).then(d => { CMP = d; render(); }).catch(e => { CMP = errObj(e); render(); });
  if (!MSIG[m]) fetch(`/api/signals?group=${CG}&method=${m}&limit=300`).then(r => r.json()).then(d => { MSIG[m] = d; render(); }).catch(e => { MSIG[m] = errObj(e); render(); });
  const [title, rule] = RULES[m];
  const st = CMP?.rows?.find(r => r.method === m && !r.sub), base = CMP?.rows?.find(r => r.method === "M0" && !r.sub);
  const head = `<section class="panel"><h2><span class="dot" style="background:${MCOLOR[m]}"></span>${m} ${title}</h2>
      <p style="margin:0 0 10px">${rule}</p>
      <div class="row">${seg("g", CG, [["backfill", "과거 채움"], ["api", "실시간 기록"]], "setCG")}
      ${seg("b", CB, [["1", "BTC 20일선 위일 때만 (기본)"], ["0", "모든 신호"]], "setCB")}</div></section>` +
    (st ? stats([[st.n, "누적 신호"], [pct(st.r72, 2), "72h 평균 수익률"], [st.win72 == null ? "–" : (st.win72 * 100).toFixed(0) + "%", "72h 승률"],
                 [pct(st.trade, 2), "거래 평균 (손절/익절 규칙)"], [st.hit30 == null ? "–" : (st.hit30 * 100).toFixed(1) + "%", "+30% 도달"],
                 [pct(st.excess72, 2), `무작위 대비 (기준선 ${pct(base?.r72, 2)})`]]) : "");
  const picks = (RUN?.signals || []).filter(s => s.method === m);
  const cards = picks.length ? `<div class="cards">${picks.map(s => `<div class="card">
      ${s.png ? `<img src="${img(s.png)}" loading="lazy" onclick="zoom(this.src)">` : ""}
      <div class="meta"><h3><span class="chip">#${s.rank ?? ""}</span> ${esc(s.symbol)} ${s.sub ? `<span class="chip">${esc(s.sub)}</span>` : ""}</h3>
      <div class="muted" style="margin-bottom:6px">선정 가격 ${s.price}</div>${detailKV(m, {...s.detail, score: s.score})}</div></div>`).join("")}</div>`
    : `<div class="empty">${RUN ? "이번 스캔에서 조건에 맞는 종목이 없습니다." : "아직 스캔 기록이 없습니다."}</div>`;
  const gated = RUN && RUN.btc_ok === false;
  const pickSec = `<section class="panel"><h2>${gated ? `<span class="chip warn">관찰만 · BTC 필터 미통과</span> ` : `<span class="chip go">진입 가능</span> `}이번 스캔 선정 종목 <span class="muted" style="font-weight:400">${RUN ? RUN.time?.slice(0, 16) + " UTC · " + (RUN.source === "api" ? "실시간" : "아카이브") : ""}</span></h2>${cards}</section>`;
  const extra = m === "M1" && RUN?.patterns?.length ? viewPattern() : m === "M2" && RUN?.range ? viewRange() : "";
  let hist = `<section class="panel"><h2>선정 기록과 결과</h2><div class="empty">불러오는 중…</div></section>`;
  if (MSIG[m]) {
    const cols = [
      {h: "시각(UTC)", l: 1, v: x => x.scan_t, f: x => x.scan_t.slice(5, 16)},
      {h: "#", v: x => x.rank, f: x => x.rank ?? ""},
      {h: "종목", l: 1, v: x => x.symbol, f: x => `<b>${esc(x.symbol)}</b> ${x.sub ? `<span class="muted">${esc(x.sub)}</span>` : ""}`},
      {h: "BTC필터", v: x => x.btc_ok, f: x => x.btc_ok ? `<span class="chip go">위</span>` : `<span class="chip">아래</span>`},
      {h: "24h", v: x => x.r24, f: x => pct(x.r24), c: x => cls(x.r24)},
      {h: "72h", v: x => x.r72, f: x => pct(x.r72), c: x => cls(x.r72)},
      {h: "최대상승", v: x => x.mfe, f: x => pct(x.mfe), c: () => "up"},
      {h: "최대하락", v: x => x.mae, f: x => pct(x.mae), c: () => "down"},
      {h: "결과", v: x => x.trade, f: x => statusChip(x.status) + " " + (x.trade == null ? "" : pct(x.trade)), c: x => cls(x.trade)},
    ];
    hist = `<section class="panel"><h2>선정 기록과 결과 (${MSIG[m].length}건)</h2>${table(cols, MSIG[m])}</section>`;
  }
  return head + pickSec + extra + hist;
}

function statusChip(s) {
  return {tp: `<span class="chip go">익절</span>`, sl: `<span class="chip bad">손절</span>`, time: `<span class="chip">72h 청산</span>`,
          open: `<span class="chip warn">보유 중</span>`}[s] || `<span class="chip">대기</span>`;
}
function setPAMT(v) { PAMT = Math.max(1, +v || 100); PAPER = null; try { localStorage.setItem("pamt", PAMT); } catch (e) {} render(); }
function setPB(v) { PB = v; PAPER = null; try { localStorage.setItem("pb", v); } catch (e) {} render(); }
function setPDAYS(v) { PDAYS = v; PAPER = null; try { localStorage.setItem("pdays", v); } catch (e) {} render(); }
async function refreshPrices() {
  const r = await fetch("/api/update", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
  const d = await r.json(); if (!d.ok) alert(d.msg); wasRunning = true; poll();
}
const usd = v => v == null ? "–" : (v >= 0 ? "+" : "-") + "$" + Math.abs(v).toFixed(2);

function curveSVG(curve) {
  const ms = Object.keys(curve); if (!ms.length) return `<div class="empty">청산된 거래가 아직 없습니다.</div>`;
  const pts = ms.flatMap(m => curve[m]);
  const ds = [...new Set(pts.map(p => p[0]))].sort(), ix = Object.fromEntries(ds.map((d, i) => [d, i]));
  const vs = pts.map(p => p[1]), lo = Math.min(0, ...vs), hi = Math.max(0, ...vs);
  const W = 900, H = 260, P = 44, sx = i => P + (ds.length < 2 ? 0 : i / (ds.length - 1)) * (W - P - 12), sy = v => 12 + (hi - v) / ((hi - lo) || 1) * (H - 36);
  const ticks = [lo, (lo + hi) / 2, hi].map(v => `<text x="${P - 6}" y="${sy(v) + 4}" text-anchor="end" class="ax">${v >= 0 ? "" : "-"}$${Math.abs(v).toFixed(0)}</text>`).join("");
  const lines = ms.map(m => `<polyline fill="none" stroke="${MCOLOR[m]}" stroke-width="${m === "M0" ? 1.5 : 2.2}" ${m === "M0" ? 'stroke-dasharray="4 3"' : ""}
     points="${curve[m].map(p => sx(ix[p[0]]) + "," + sy(p[1])).join(" ")}"><title>${m}</title></polyline>`).join("");
  const xl = [0, Math.floor((ds.length - 1) / 2), ds.length - 1].filter((v, i, a) => a.indexOf(v) === i)
    .map(i => `<text x="${sx(i)}" y="${H - 4}" text-anchor="middle" class="ax">${ds[i].slice(5)}</text>`).join("");
  const legend = ms.map(m => `<span style="margin-right:12px"><span class="dot" style="background:${MCOLOR[m]}"></span>${m}${m === "M0" ? " (기준선)" : ""}</span>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><line x1="${P}" x2="${W - 12}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)"/>
    ${ticks}${xl}${lines}</svg><div style="font-size:12px;margin-top:6px">${legend}</div>`;
}

function viewPaper() {
  if (!PAPER) { fetch(`/api/paper?group=${CG}&amount=${PAMT}&days=${PDAYS}&btc=${PB}`).then(r => r.json()).then(d => { PAPER = d; render(); }).catch(e => { PAPER = errObj(e); render(); }); }
  const head = `<section class="panel"><h2>가상 매매</h2>
    <p style="margin:0 0 10px">각 방식이 고른 종목을 선정 시점 가격에 <b>$${PAMT}</b>씩 산 것으로 보고, 손절 -8% / 익절 +15% / 72시간 뒤 청산(수수료 0.2%)으로 결과를 계산합니다. 아직 안 끝난 거래는 현재가로 평가합니다.</p>
    <div class="row">${seg("g", CG, [["backfill", "과거 채움"], ["api", "실시간 기록"]], "setCG")}
      ${seg("p", PB, [["1", "BTC 20일선 위일 때만 매수"], ["0", "모든 신호 매수"]], "setPB")}
      ${seg("d", PDAYS, [["0", "전체 기간"], ["30", "최근 30일"], ["7", "최근 7일"]], "setPDAYS")}
      <label class="muted">1건당 금액 $<input type="number" value="${PAMT}" min="1" style="width:90px" onchange="setPAMT(this.value)"></label>
      ${CG === "api" ? `<button onclick="refreshPrices()">현재가로 갱신</button>` : ""}</div></section>`;
  if (!PAPER) return head + `<div class="panel empty">불러오는 중…</div>`;
  if (!PAPER.summary?.length) return head + `<div class="panel empty">${PB === "1" ? "BTC 가 20일선 위였던 시점의 신호가 아직 없습니다. 위에서 '모든 신호 매수' 로 바꾸면 전체를 볼 수 있습니다." : "아직 기록된 신호가 없습니다."}</div>`;
  const S = PAPER.summary, six = S.filter(r => r.method !== "M0"), base = S.find(r => r.method === "M0");
  const inv = six.reduce((a, r) => a + r.invested, 0), tot = six.reduce((a, r) => a + r.total, 0), opn = six.reduce((a, r) => a + r.open, 0);
  const best = [...six].sort((a, b) => b.ret - a.ret)[0];
  const sumCols = [
    {h: "방식", l: 1, v: x => x.method, f: x => `<span class="dot" style="background:${MCOLOR[x.method]}"></span><b>${x.method}</b> ${esc(x.name)}`},
    {h: "매수 건수", v: x => x.trades, f: x => x.trades},
    {h: "보유 중", v: x => x.open, f: x => x.open},
    {h: "익절/손절/72h", v: x => x.tp, f: x => `<span class="up">${x.tp}</span> / <span class="down">${x.sl}</span> / ${x.time}`},
    {h: "승률(청산)", v: x => x.win, f: x => x.win == null ? "–" : (x.win * 100).toFixed(0) + "%"},
    {h: "투입", v: x => x.invested, f: x => "$" + x.invested.toFixed(0)},
    {h: "실현 손익", v: x => x.realized, f: x => usd(x.realized), c: x => cls(x.realized)},
    {h: "평가 손익", v: x => x.unrealized, f: x => usd(x.unrealized), c: x => cls(x.unrealized)},
    {h: "합계", v: x => x.total, f: x => `<b>${usd(x.total)}</b>`, c: x => cls(x.total)},
    {h: "수익률", v: x => x.ret, f: x => pct(x.ret, 2), c: x => cls(x.ret)},
  ];
  const posCols = closed => [
    {h: closed ? "청산(UTC)" : "매수(UTC)", l: 1, v: x => closed ? x.exit_t : x.scan_t, f: x => ((closed ? x.exit_t : x.scan_t) || "").slice(5, 16)},
    {h: "방식", l: 1, v: x => x.method, f: x => `<span class="dot" style="background:${MCOLOR[x.method]}"></span>${x.method}${x.rank ? " #" + x.rank : ""}`},
    {h: "종목", l: 1, v: x => x.symbol, f: x => `<b>${esc(x.symbol)}</b>`},
    {h: "매수가", v: x => x.price, f: x => +x.price.toPrecision(6)},
    {h: closed ? "청산가" : "현재가", v: x => closed ? x.exit_price : x.last_price, f: x => { const v = closed ? x.exit_price : x.last_price; return v == null ? "–" : +v.toPrecision(6); }},
    {h: "수익률", v: x => x.ret, f: x => pct(x.ret, 2), c: x => cls(x.ret)},
    {h: "손익", v: x => x.pnl, f: x => usd(x.pnl), c: x => cls(x.pnl)},
    {h: "최대상승/하락", v: x => x.mfe, f: x => `<span class="up">${pct(x.mfe)}</span> / <span class="down">${pct(x.mae)}</span>`},
    {h: "결과", v: x => x.status, f: x => statusChip(x.status) + (x.stale ? ` <span class="chip" title="아직 현재가 갱신 전이라 선정가로 평가">갱신 전</span>` : "")},
    {h: "차트", v: x => x.png ? 1 : 0, f: x => x.png ? "보기" : ""},
  ];
  const clickPng = list => s => { const r = list.find(x => x.symbol === s && x.png); if (r) zoom(img(r.png)); };
  return head + stats([["$" + inv.toFixed(0), "6가지 방식 총 투입"], [usd(tot), "총 손익 (실현+평가)"], [pct(inv ? tot / inv : null, 2), "총 수익률"],
                       [opn, "보유 중 포지션"], [best ? `${best.method} ${pct(best.ret, 2)}` : "–", "수익률 1위"],
                       [base ? pct(base.ret, 2) : "–", "무작위 기준선 수익률"]]) +
    `<section class="panel"><h2>방식별 가상 계좌</h2>${table(sumCols, S, {sort: 9})}
      <p class="note">M0 무작위는 비교용 기준선이며 총합에서 제외. 수익률 = 합계 손익 / 투입.</p></section>
     <section class="panel"><h2>누적 실현 손익</h2>${curveSVG(PAPER.curve)}</section>
     <section class="panel"><h2>보유 중 (${PAPER.open.length})</h2>${table(posCols(false), PAPER.open, {click: clickPng(PAPER.open)})}</section>
     <section class="panel"><h2>청산 완료 (최근 ${PAPER.closed.length})</h2>${table(posCols(true), PAPER.closed, {click: clickPng(PAPER.closed)})}</section>`;
}

  const body = {compare: viewCompare, paper: viewPaper, pattern: viewPattern, range: viewRange, library: viewLibrary, bt: viewBT}[TAB]();
  $("#view").innerHTML = errBanner() + (["compare", "paper"].includes(TAB) ? btcGate() : "") + body;
}
$("#tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  TAB = b.dataset.t; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  try { localStorage.setItem("tab", TAB); } catch (e) {}
  render();
};
try { let t = localStorage.getItem("tab"); t = {pattern: "M1", range: "M2"}[t] || t; if (t) { TAB = t; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x.dataset.t === t)); } } catch (e) {}

async function loadRuns(pick) {
  const runs = await (await fetch("/api/runs")).json();
  const sel = $("#runSel");
  sel.innerHTML = runs.map(r => `<option value="${r.stamp}">${r.time?.slice(0, 16)} UTC · ${r.mode} · ${r.source}</option>`).join("") ||
    `<option>기록 없음</option>`;
  if (runs.length) { sel.value = pick || runs[0].stamp; await loadRun(sel.value); } else { RUN = null; render(); }
}
async function loadRun(stamp) {
  RUN = await (await fetch("/api/run/" + stamp)).json();
  $("#runInfo").textContent = `상위: ${RUN.top.map(t => t.symbol.replace("USDT", "") + " " + pct(t.chg24, 0)).join(", ")}`;
  LIB = null; render();
}
$("#runSel").onchange = e => loadRun(e.target.value);

// scan job
let wasRunning = false, autoTimer = null;
async function poll() {
  const s = await (await fetch("/api/status")).json();
  const st = $("#jobState"), log = $("#log");
  if (s.log) { log.hidden = false; log.textContent = s.log; log.scrollTop = log.scrollHeight; }
  st.textContent = s.running ? "실행 중…" : s.code == null ? "대기" : s.code === 0 ? "완료" : "오류 (로그 확인)";
  st.className = "chip " + (s.running ? "" : s.code === 0 ? "go" : s.code ? "bad" : "");
  $("#runBtn").disabled = s.running;
  if (wasRunning && !s.running) { BT = null; CMP = null; SIGS = null; MSIG = {}; PAPER = null; await loadRuns(); }
  wasRunning = s.running;
  return s;
}
async function runScan() {
  const p = {};
  ["source", "top", "pick", "lookback", "range_hours", "recent", "vol_mult"].forEach(k => p[k] = $("#p_" + k).value);
  p.library = $("#p_library").checked;
  try { localStorage.setItem("params", JSON.stringify(p)); } catch (e) {}
  const r = await fetch("/api/scan", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(p)});
  const d = await r.json();
  if (!d.ok) alert(d.msg);
  wasRunning = true; poll();
}
$("#runBtn").onclick = runScan;
$("#autoRun").onchange = () => {
  clearInterval(autoTimer);
  if ($("#autoRun").checked) autoTimer = setInterval(() => { if (!$("#runBtn").disabled) runScan(); }, +$("#autoMin").value * 60000);
};
$("#autoMin").onchange = () => $("#autoRun").onchange();

(async () => {
  const s = await poll();
  $("#p_source").value = s.default_source || "api";
  try {
    const p = JSON.parse(localStorage.getItem("params") || "null");
    if (p) { for (const [k, v] of Object.entries(p)) { const el = $("#p_" + k); if (el) el.type === "checkbox" ? el.checked = v : el.value = v; } }
  } catch (e) {}
  await loadRuns();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
